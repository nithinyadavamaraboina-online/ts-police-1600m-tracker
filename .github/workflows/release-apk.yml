name: Build & Publish OTA APK

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Release notes shown in the in-app OTA update prompt"
        required: false
        default: "Performance improvements and bug fixes."

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode OTA Keystore (if configured in repo secrets)
        if: ${{ secrets.OTA_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.OTA_KEYSTORE_BASE64 }}" | base64 -d > keystore/ts-police-ota.jks

      - name: Run Unit Tests & Assemble Release APK
        env:
          OTA_KEYSTORE_PATH: ${{ secrets.OTA_KEYSTORE_BASE64 != '' && 'keystore/ts-police-ota.jks' || '' }}
          OTA_STORE_PASSWORD: ${{ secrets.OTA_STORE_PASSWORD }}
          OTA_KEY_ALIAS: ${{ secrets.OTA_KEY_ALIAS }}
          OTA_KEY_PASSWORD: ${{ secrets.OTA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare Release Artifacts & version.json
        id: meta
        run: |
          cp app/build/outputs/apk/release/app-release.apk ts-police-1600m-tracker.apk
          VCODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          VNAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SHA=$(sha256sum ts-police-1600m-tracker.apk | awk '{print $1}')
          PUB=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="${{ github.event.inputs.changelog || 'New OTA update published via GitHub Actions.' }}"
          jq -n \
            --argjson versionCode "$VCODE" \
            --arg versionName "$VNAME" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/latest/download/ts-police-1600m-tracker.apk" \
            --arg sha256 "$SHA" \
            --arg changelog "$NOTES" \
            --arg publishedAt "$PUB" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, changelog: $changelog, publishedAt: $publishedAt}' > version.json
          echo "tag=v$VNAME" >> "$GITHUB_OUTPUT"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TS Police 1.6K Tracker v${{ steps.meta.outputs.vname }}
          body: |
            ${{ github.event.inputs.changelog || 'Automated OTA release build.' }}

            [versionCode:${{ steps.meta.outputs.vcode }}]
            SHA-256: `${{ steps.meta.outputs.sha }}`
          files: |
            ts-police-1600m-tracker.apk
            version.json
